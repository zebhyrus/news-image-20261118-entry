  <!-- FOOTER -->
  <text x="512" y="996" text-anchor="middle" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="15" fill="#666666">THE WORLD — SIX STORIES FROM WEDNESDAY 18 NOVEMBER 2026</text>
