    <circle cx="55" cy="760" r="6" fill="#B3261E"/><circle cx="155" cy="790" r="6" fill="#B3261E"/><circle cx="60" cy="850" r="6" fill="#B3261E"/><circle cx="150" cy="880" r="6" fill="#B3261E"/><circle cx="70" cy="940" r="6" fill="#B3261E"/><circle cx="150" cy="950" r="6" fill="#B3261E"/>
