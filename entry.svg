    <circle cx="837" cy="496" r="34" fill="#D64541"/>
    <circle cx="825" cy="488" r="6" fill="#8E1F1C"/><circle cx="849" cy="490" r="5" fill="#8E1F1C"/><circle cx="837" cy="508" r="6" fill="#8E1F1C"/>
    <circle cx="948" cy="524" r="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="942" y="512" width="12" height="24" fill="#B3261E"/><rect x="936" y="518" width="24" height="12" fill="#B3261E"/>
    <text x="696" y="576" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" letter-spacing="1" fill="#0F5132">HEALTH — DR CONGO</text>
    <text x="696" y="608" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">EBOLA IN CONGO</text>
    <text x="696" y="638" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">MORE THAN DOUBLE</text>
    <text x="696" y="664" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="18" fill="#333333">11,000+ cases, 5,400 deaths;</text>
    <text x="696" y="688" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="18" fill="#333333">3 in 4 children under 5 die.</text>
  </g>

