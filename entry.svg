    <circle cx="80" cy="200" r="2" fill="#FFFFFF"/><circle cx="150" cy="225" r="2" fill="#FFFFFF"/><circle cx="240" cy="195" r="2" fill="#FFFFFF"/><circle cx="330" cy="210" r="2" fill="#FFFFFF"/><circle cx="370" cy="240" r="2" fill="#FFFFFF"/>
    <line x1="185" y1="250" x2="120" y2="250" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 6"/>
    <polygon points="310,250 215,238 192,245 192,255 215,262" fill="#EDEDED" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="255,250 218,214 238,250" fill="#EDEDED" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="255,250 218,286 238,250" fill="#EDEDED" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="196,244 178,224 192,250" fill="#EDEDED" stroke="#1A1A1A" stroke-width="2"/>
    <ellipse cx="282" cy="250" rx="10" ry="5" fill="#7FB3D5"/>
    <polygon points="345,273 387,315 345,357 303,315" fill="#F5A623"/>
    <polygon points="375,285 375,345 315,345 315,285" fill="#F5A623"/>
    <polygon points="345,293 367,315 345,337 323,315" fill="#E4572E"/>
    <circle cx="345" cy="315" r="10" fill="#FFFFFF"/>
