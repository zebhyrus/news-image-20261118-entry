    <text x="371" y="688" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="18" fill="#333333">summit set for 19 November.</text>
  </g>
  <!-- Ebola in Congo -->
  <g>
    <rect x="682" y="440" width="310" height="266" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
