  <line x1="40" y1="112" x2="984" y2="112" stroke="#1A1A1A" stroke-width="3"/>
  <text x="512" y="154" text-anchor="middle" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="42" font-weight="bold" letter-spacing="2" fill="#B3261E">WEDNESDAY 18 NOVEMBER 2026</text>

  <!-- HERO: GULF ESCALATES -->
  <g>
    <rect x="32" y="172" width="960" height="252" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
