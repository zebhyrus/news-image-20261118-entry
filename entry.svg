    <g stroke="#7FB3D5" stroke-width="2" stroke-linecap="round">
      <line x1="545" y1="760" x2="555" y2="770"/><line x1="555" y1="760" x2="545" y2="770"/>
      <line x1="640" y1="750" x2="650" y2="760"/><line x1="650" y1="750" x2="640" y2="760"/>
      <line x1="625" y1="830" x2="635" y2="840"/><line x1="635" y1="830" x2="625" y2="840"/>
      <line x1="550" y1="850" x2="560" y2="860"/><line x1="560" y1="850" x2="550" y2="860"/>
    </g>
    <text x="688" y="796" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="19" font-weight="bold" letter-spacing="1" fill="#1F4E79">GAZA</text>
    <text x="688" y="834" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="27" font-weight="bold" fill="#1A1A1A">FREEZING COLD</text>
    <text x="688" y="868" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="27" font-weight="bold" fill="#1A1A1A">KILLS IN GAZA TENTS</text>
    <text x="688" y="904" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="19" fill="#333333">Australia, Canada, Italy, UK</text>
    <text x="688" y="930" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="19" fill="#333333">demand aid reach flooded Gaza.</text>
