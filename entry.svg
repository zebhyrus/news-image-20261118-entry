    <rect x="46" y="470" width="124" height="16" fill="#8A8A8A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="216" y="470" width="112" height="16" fill="#8A8A8A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="60" y="486" width="10" height="34" fill="#6E6E6E"/>
