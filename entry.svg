<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- THE WORLD — Wednesday 18 November 2026. A newspaper front page summing up the day in six stories. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#F7F1E3"/>
  <rect x="10" y="10" width="1004" height="1004" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- MASTHEAD -->
