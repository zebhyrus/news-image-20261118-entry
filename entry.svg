    <rect x="606" y="462" width="54" height="46" fill="#B22234"/>
    <rect x="606" y="469" width="54" height="6" fill="#FFFFFF"/><rect x="606" y="481" width="54" height="6" fill="#FFFFFF"/><rect x="606" y="493" width="54" height="6" fill="#FFFFFF"/>
    <rect x="606" y="462" width="24" height="24" fill="#3C3B6E"/>
    <circle cx="612" cy="468" r="1.5" fill="#FFFFFF"/><circle cx="620" cy="468" r="1.5" fill="#FFFFFF"/><circle cx="616" cy="474" r="1.5" fill="#FFFFFF"/><circle cx="624" cy="474" r="1.5" fill="#FFFFFF"/><circle cx="612" cy="480" r="1.5" fill="#FFFFFF"/><circle cx="620" cy="480" r="1.5" fill="#FFFFFF"/>
    <text x="371" y="576" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="18" font-weight="bold" letter-spacing="1" fill="#B3261E">CHINA — APEC SUMMIT</text>
    <text x="371" y="608" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">XI HOSTS PUTIN;</text>
    <text x="371" y="638" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">TRUMP ARRIVES</text>
