    <line x1="86" y1="400" x2="86" y2="420" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 100,384 A 34,34 0 0 1 126,358" fill="none" stroke="#7FB3D5" stroke-width="3"/>
    <path d="M 112,372 A 48,48 0 0 1 146,338" fill="none" stroke="#7FB3D5" stroke-width="3"/>
    <rect x="348" y="392" width="28" height="18" fill="#8A8A8A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="359" y="368" width="6" height="24" fill="#CCCCCC" stroke="#1A1A1A" stroke-width="1.5"/>
    <polygon points="356,368 368,368 362,356" fill="#E4572E" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- hero text -->
    <text x="428" y="212" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="20" font-weight="bold" letter-spacing="2" fill="#B3261E">MIDDLE EAST — GULF</text>
    <text x="428" y="258" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="40" font-weight="bold" fill="#1A1A1A">U.S. JETS STRIKE IRAN</text>
    <text x="428" y="302" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="40" font-weight="bold" fill="#1A1A1A">MISSILE SITE</text>
    <text x="428" y="348" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="22" fill="#333333">Iran fires drones at U.S. radar in Bahrain —</text>
    <text x="428" y="378" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="22" fill="#333333">intercepted — and targets Kuwait.</text>
  </g>

