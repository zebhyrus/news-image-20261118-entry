    <text x="46" y="608" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">KERCH BRIDGE</text>
    <text x="46" y="638" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">PARTLY DESTROYED</text>
    <text x="46" y="664" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="18" fill="#333333">Ukrainian drones and missiles</text>
    <text x="46" y="688" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="18" fill="#333333">hit the link; an arch falls.</text>
  </g>
  <!-- Shenzhen summit -->
  <g>
    <rect x="357" y="440" width="310" height="266" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
