    <text x="200" y="868" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="29" font-weight="bold" fill="#1A1A1A">STATUS LOST</text>
    <text x="200" y="904" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="19" fill="#333333">More than 5,400 cases and</text>
    <text x="200" y="930" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-size="19" fill="#333333">10 deaths, after 26 years.</text>
